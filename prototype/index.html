<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>AbleTap companion review</title>
  <style>
    :root { color-scheme: light; font-family: ui-rounded, system-ui, sans-serif; background:#f8f4ec; color:#211f1b; }
    * { box-sizing:border-box; }
    body { margin:0; padding:32px 20px 56px; }
    main { max-width:1080px; margin:auto; }
    h1 { font-size:clamp(1.8rem,4vw,3rem); margin:0 0 8px; }
    .note { max-width:760px; margin:0 0 28px; line-height:1.5; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:18px; }
    button.card { appearance:none; border:3px solid transparent; border-radius:24px; background:white; padding:12px 12px 16px; color:inherit; box-shadow:0 8px 24px #2b241b18; cursor:pointer; text-align:center; }
    button.card:focus-visible, button.card[aria-pressed="true"] { outline:none; border-color:var(--accent); box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 25%,transparent); }
    .portrait { display:block; position:relative; overflow:hidden; border-radius:18px; aspect-ratio:1; }
    .portrait > img { width:100%; height:100%; display:block; }
    .mouth { position:absolute; left:42.5%; top:55%; width:15%; height:7%; overflow:hidden; transform-origin:center; border-radius:50%; pointer-events:none; }
    .mouth img { position:absolute; width:666.666%; height:auto; left:-283.333%; top:-785.714%; max-width:none; }
    .speaking .mouth { animation:talk 140ms steps(2,end) infinite alternate; }
    @keyframes talk { from { transform:scaleY(.86) scaleX(1.02); } to { transform:scaleY(1.18) scaleX(.96); } }
    .name { display:block; font-size:1.25rem; font-weight:750; margin-top:10px; }
    .role { display:block; opacity:.72; margin-top:2px; }
    .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:28px 0; }
    .speak { border:0; border-radius:16px; background:#211f1b; color:white; font:inherit; font-weight:750; padding:15px 20px; cursor:pointer; min-height:52px; }
    .status { min-height:24px; }
    @media (prefers-reduced-motion: reduce) { .speaking .mouth { animation-duration:280ms; } }
  </style>
</head>
<body>
<main>
  <h1>Choose your companion</h1>
  <p class="note">Review prototype. Select a companion, then use the device's built-in speech. The mouth effect is a no-service-cost proof of concept, not the final layered rig.</p>
  <section class="grid" id="grid" aria-label="Companions"></section>
  <div class="controls">
    <button class="speak" id="speak">Hear selected companion</button>
    <span class="status" id="status" aria-live="polite">Ava selected.</span>
  </div>
</main>
<script>
const companions = [
  ['ava','Ava','calm default','#6B4CE0'],
  ['sunny','Sunny','bright and upbeat','#F4B96B'],
  ['alex','Alex','steady professional','#F5926A'],
  ['buzz','Buzz','friendly and upbeat','#2E9C84'],
  ['grace','Grace','gentle','#8D6BD8']
];
const grid = document.querySelector('#grid');
const status = document.querySelector('#status');
let selected = 'ava';
for (const [id,name,role,accent] of companions) {
  const card = document.createElement('button');
  card.className = 'card'; card.dataset.id = id; card.style.setProperty('--accent',accent);
  card.setAttribute('aria-pressed', id === selected ? 'true' : 'false');
  card.innerHTML = `<span class="portrait"><img src="../assets/app-512/${id}.png" alt="${name}, ${role}"><span class="mouth" aria-hidden="true"><img src="../assets/app-512/${id}.png" alt=""></span></span><span class="name">${name}</span><span class="role">${role}</span>`;
  card.addEventListener('click', () => {
    selected = id;
    document.querySelectorAll('.card').forEach(el => el.setAttribute('aria-pressed', String(el === card)));
    status.textContent = `${name} selected.`;
  });
  grid.append(card);
}
document.querySelector('#speak').addEventListener('click', () => {
  speechSynthesis.cancel();
  const card = document.querySelector(`[data-id="${selected}"]`);
  const name = companions.find(item => item[0] === selected)[1];
  const utterance = new SpeechSynthesisUtterance(`Hi, I'm ${name}. I'm here with you. What would you like to do?`);
  utterance.onstart = () => { card.classList.add('speaking'); status.textContent = `${name} is speaking.`; };
  const stop = () => { card.classList.remove('speaking'); status.textContent = `${name} selected.`; };
  utterance.onend = stop; utterance.onerror = stop;
  speechSynthesis.speak(utterance);
});
</script>
</body>
</html>
