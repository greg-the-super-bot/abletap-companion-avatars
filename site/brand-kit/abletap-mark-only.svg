  </linearGradient>
  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#6B3FE0"/>
    <stop offset="1" stop-color="#A579E8"/>
  </linearGradient>
  <linearGradient id="coral" x1="0" y1="0" x2="1" y2="1">
