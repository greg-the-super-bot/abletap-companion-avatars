<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AbleTap AT mosaic</title>
  <desc id="desc">A cream AT monogram cut through four rounded communication tiles in purple, coral, teal and gold.</desc>
  <defs>
