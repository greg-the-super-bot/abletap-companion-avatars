<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6B4CE0"/><stop offset=".55" stop-color="#8A5BE6"/><stop offset="1" stop-color="#F5926A"/></linearGradient>
    <filter id="ws" x="-60%" y="-60%" width="220%" height="220%">
      <feMorphology in="SourceAlpha" operator="dilate" radius="0.8" result="d"/>
      <feFlood flood-color="#FFFFFF" flood-opacity="0.97"/>
      <feComposite in2="d" operator="in" result="halo"/>
      <feGaussianBlur in="halo" stdDeviation="0.5" result="haloTight"/>
