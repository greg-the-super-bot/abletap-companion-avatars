      <feMerge><feMergeNode in="haloSoft"/><feMergeNode in="haloSoft"/><feMergeNode in="haloTight"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#g)"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#FAF5EF" stroke-opacity=".20" stroke-width="2.4"/>
