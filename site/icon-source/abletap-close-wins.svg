<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">AbleTap close wins icon</title>
  <desc id="desc">Three white target rings with a large white hand touching the upper-left edge instead of the center, plus three action marks.</desc>
  <defs>
    <linearGradient id="abletap-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4B96B"/>
      <stop offset="0.2" stop-color="#F5926A"/>
      <stop offset="0.52" stop-color="#E33E68"/>
      <stop offset="1" stop-color="#4B278A"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2B2236" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Full-bleed and opaque: Apple/Google apply the platform mask. -->
  <rect width="1024" height="1024" fill="url(#abletap-gradient)"/>

  <!-- The three-ring AbleTap system. The center remains visibly untouched. -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="468" cy="448" r="326" stroke-width="68"/>
    <circle cx="468" cy="448" r="214" stroke-width="34"/>
    <circle cx="468" cy="448" r="96" stroke-width="30"/>
  </g>

  <!-- Three contact accents. They sit outside the fingertip, never over the bullseye. -->
  <g stroke="#FFFFFF" stroke-width="28" stroke-linecap="round">
    <path d="M151 164 L111 120"/>
    <path d="M126 224 L68 215"/>
    <path d="M178 119 L169 62"/>
  </g>

  <!-- One clear oversized hand. Fingertip lands on the upper-left outer ring. -->
  <path transform="translate(250 230) rotate(36) scale(.80) translate(-250 -230)" filter="url(#soft-shadow)" fill="#FFFFFF" d="
    M276 202
    C245 182 207 193 188 223
    C174 245 175 273 190 295
    L401 605
    L355 568
    C323 542 276 547 250 580
    C225 613 231 659 263 686
    L449 848
    C499 892 565 916 632 916
    C743 916 834 838 855 730
    L888 558
    C896 519 871 481 832 473
    C793 466 756 491 748 530
    L731 615
    L752 506
    C760 465 733 426 692 419
    C651 412 613 439 606 480
    L585 591
    L599 493
    C605 451 576 413 534 407
    C492 401 454 431 449 473
    L438 572
    L323 239
    C315 223 299 211 276 202
    Z"/>
</svg>
